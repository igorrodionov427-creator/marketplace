<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F1ECE5">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23f97316'/><text x='50%25' y='55%25' font-size='20' font-family='Arial Narrow, Arial' font-weight='800' text-anchor='middle' dominant-baseline='central' fill='%230b0f14'>P</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@600&display=swap">
  <title>PEAKR</title>
  <style>
    :root{
      --bg:#0e1116; --fg:#f8fafc; --muted:#aeb7c2; --accent:#f97316;
      --surface:#161b22; --border:#2a313c; --primary:#f97316; --primary-fg:#0b0f14;
      --font-display:'Barlow Condensed','Arial Narrow',sans-serif; --font-body:'Barlow',system-ui,sans-serif;
      --font-mono:'JetBrains Mono',ui-monospace,monospace;
    }
    :root[data-theme="light"]{
      --bg:#f4f5f7; --fg:#0f172a; --muted:#47536a; --accent:#ea580c;
      --surface:#fff; --border:#dde2e9; --primary:#f97316; --primary-fg:#10151f;
    }
    *{box-sizing:border-box;margin:0}
    body{background:var(--bg);color:var(--fg);font-family:var(--font-body);min-height:100vh;
      display:grid;place-items:center;padding:24px;-webkit-font-smoothing:antialiased}
    body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
      background:radial-gradient(60% 50% at 82% -5%,rgba(249,115,22,.16),transparent 70%)}
    .wrap{text-align:center;max-width:540px}
    .mark{width:46px;height:46px;border-radius:8px;background:var(--primary);color:var(--primary-fg);
      display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:1.5rem;margin:0 auto 28px}
    .code{font-family:var(--font-display);font-size:clamp(6rem,26vw,11rem);font-weight:800;line-height:.9;letter-spacing:.01em;text-transform:uppercase}
    .code em{font-style:normal;color:var(--accent)}
    h1{font-family:var(--font-display);font-weight:700;text-transform:uppercase;letter-spacing:.02em;font-size:2rem;margin:8px 0 8px}
    p{color:var(--muted);font-size:1.05rem;line-height:1.6;margin-bottom:28px}
    .btn{display:inline-flex;align-items:center;gap:9px;padding:14px 26px;border-radius:6px;
      background:var(--primary);color:var(--primary-fg);text-decoration:none;font-weight:700;font-size:.9rem;
      text-transform:uppercase;letter-spacing:.04em;box-shadow:0 8px 24px rgba(249,115,22,.25);transition:transform .12s ease}
    .btn:hover{transform:translateY(-1px)}
    .eyebrow{font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.2em;font-size:.72rem;color:var(--accent);margin-bottom:8px;font-weight:600}
  </style>
  <script>(function(){try{var s=localStorage.getItem('mkt_theme');document.documentElement.setAttribute('data-theme','light');}catch(e){}})();</script>
</head>
<body>
  <div class="wrap">
    <div class="mark">P</div>
    <div class="eyebrow" id="eyebrow">Page not found</div>
    <div class="code">4<em>0</em>4</div>
    <h1 id="title">This page doesn't exist</h1>
    <p id="desc">The link may be broken or the page may have been moved. Let's get you back to the store.</p>
    <a class="btn" id="homeBtn" href="/">Back to store</a>
  </div>
  <script>
    (function(){
      var L={
        en:["Page not found","This page doesn't exist","The link may be broken or the page may have been moved. Let's get you back to the store.","Back to store"],
        ru:["Страница не найдена","Такой страницы нет","Ссылка устарела или страница была перемещена. Вернёмся в магазин.","Вернуться в магазин"],
        de:["Seite nicht gefunden","Diese Seite existiert nicht","Der Link ist evtl. defekt oder die Seite wurde verschoben.","Zurück zum Shop"],
        fr:["Page introuvable","Cette page n'existe pas","Le lien est peut-être rompu ou la page a été déplacée.","Retour à la boutique"],
        es:["Página no encontrada","Esta página no existe","El enlace puede estar roto o la página se ha movido.","Volver a la tienda"],
        it:["Pagina non trovata","Questa pagina non esiste","Il link potrebbe essere rotto o la pagina spostata.","Torna al negozio"],
        pl:["Nie znaleziono strony","Ta strona nie istnieje","Link może być nieaktualny lub strona została przeniesiona.","Powrót do sklepu"]
      };
      var lang="en";
      try{var s=localStorage.getItem('mkt_lang');if(s&&L[s])lang=s;}catch(e){}
      var t=L[lang]||L.en;
      document.documentElement.lang=lang;
      document.getElementById('eyebrow').textContent=t[0];
      document.getElementById('title').textContent=t[1];
      document.getElementById('desc').textContent=t[2];
      document.getElementById('homeBtn').textContent=t[3];
      var parts=location.pathname.split('/').filter(Boolean);
      document.getElementById('homeBtn').setAttribute('href', parts.length>1?('/'+parts[0]+'/'):'/');
    })();
  </script>
</body>
</html>
